
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Free Tools</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f5ff;color:#17213b}
header{background:linear-gradient(135deg,#172554,#4f46e5);color:white;text-align:center;padding:30px 15px}
header h1{margin:0;font-size:30px}
header p{margin:10px 0 0;color:#dbeafe}
main{max-width:850px;margin:25px auto;padding:0 15px}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:white;padding:18px;border-radius:14px;box-shadow:0 3px 12px #0000000c}
.card h2{font-size:19px;color:#3730a3;margin-top:0}
input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccd3e5;border-radius:8px;font-size:16px}
textarea{min-height:100px;resize:vertical}
button{background:#4f46e5;color:white;border:0;padding:12px 15px;border-radius:8px;font-size:15px;cursor:pointer;margin:4px 2px}
button:hover{background:#3730a3}
.result{font-weight:bold;color:#166534;margin-top:12px;overflow-wrap:anywhere}
.full{grid-column:1/-1}
footer{text-align:center;padding:25px;color:#64748b}
@media(max-width:550px){.tools{grid-template-columns:1fr}header h1{font-size:25px}}
</style>
</head>
<body>
<header>
<h1>Quick Free Tools</h1>
<p>Free Online Tools – Easy, Fast and Simple</p>
</header>

<main>
<div class="tools">

<section class="card">
<h2>🎂 Age Calculator</h2>
<label>Enter your date of birth:</label>
<input type="date" id="dob">
<button onclick="ageCalc()">Calculate Age</button>
<div class="result" id="ageResult"></div>
</section>

<section class="card">
<h2>📝 Word Counter</h2>
<textarea id="words" placeholder="Type or paste your text here..." oninput="countWords()"></textarea>
<div class="result" id="wordResult">Words: 0 | Characters: 0</div>
</section>

<section class="card">
<h2>📊 Percentage Calculator</h2>
<input type="number" id="num" placeholder="Enter number">
<input type="number" id="total" placeholder="Enter total">
<button onclick="percentage()">Calculate</button>
<div class="result" id="percentResult"></div>
</section>

<section class="card">
<h2>🔠 Text Case Converter</h2>
<textarea id="textCase" placeholder="Enter your text here..."></textarea>
<button onclick="convertCase('upper')">UPPERCASE</button>
<button onclick="convertCase('lower')">lowercase</button>
<button onclick="convertCase('title')">Title Case</button>
<button onclick="copyText()">Copy Text</button>
<div class="result" id="caseResult"></div>
</section>

</div>
</main>

<footer>
<p>© 2026 Quick Free Tools. All Rights Reserved.</p>
<p>Free tools for everyone!</p>
</footer>

<script>
function ageCalc(){
 const v=document.getElementById('dob').value;
 const out=document.getElementById('ageResult');
 if(!v){out.textContent='Please select your birth date.';return;}
 const birth=new Date(v+'T00:00:00');
 const today=new Date();
 if(birth>today){out.textContent='Birth date cannot be in the future.';return;}
 let years=today.getFullYear()-birth.getFullYear();
 let months=today.getMonth()-birth.getMonth();
 let days=today.getDate()-birth.getDate();
 if(days<0){
  months--;
  days+=new Date(today.getFullYear(),today.getMonth(),0).getDate();
 }
 if(months<0){years--;months+=12;}
 out.textContent=years+' Years, '+months+' Months, '+days+' Days';
}
function countWords(){
 const t=document.getElementById('words').value;
 const words=t.trim()?t.trim().split(/\s+/).length:0;
 document.getElementById('wordResult').textContent=
 'Words: '+words+' | Characters: '+t.length;
}
function percentage(){
 const n=parseFloat(document.getElementById('num').value);
 const t=parseFloat(document.getElementById('total').value);
 const out=document.getElementById('percentResult');
 if(!Number.isFinite(n)||!Number.isFinite(t)||t===0){
 out.textContent='Please enter valid numbers. Total cannot be zero.';return;
 }
 out.textContent=(n/t*100).toFixed(2)+'%';
}
function convertCase(type){
 const el=document.getElementById('textCase');
 let t=el.value;
 if(type==='upper')t=t.toUpperCase();
 if(type==='lower')t=t.toLowerCase();
 if(type==='title')t=t.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
 el.value=t;
 document.getElementById('caseResult').textContent='Text converted successfully!';
}
function copyText(){
 const el=document.getElementById('textCase');
 if(!el.value){document.getElementById('caseResult').textContent='Enter some text first.';return;}
 if(navigator.clipboard && window.isSecureContext){
 navigator.clipboard.writeText(el.value).then(()=>{
 document.getElementById('caseResult').textContent='Text copied!';
 }).catch(()=>fallbackCopy(el));
 }else{fallbackCopy(el);}
}
function fallbackCopy(el){
 el.select();
 document.execCommand('copy');
 document.getElementById('caseResult').textContent='Text copied!';
}
</script>
</body>
</html>
